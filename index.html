<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Simple Blog</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: auto;
      padding: 40px 20px;
      line-height: 1.8;
      color: #333;
    }

    header {
      border-bottom: 1px solid #ddd;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 36px;
    }

    .date {
      color: #777;
      font-size: 14px;
    }

    article {
      margin-bottom: 60px;
    }

    footer {
      border-top: 1px solid #ddd;
      padding-top: 20px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>My Blog</h1>
  <p>Simple articles and updates</p>
</header>

<article>
  <h2>My First Blog Post</h2>

  <p class="date">August 26, 2026</p>

  <p>
    Welcome to my blog! This is my first article.
  </p>

  <p>
    You can write your complete blog content here.
  </p>
</article>

<footer>
  © 2026 My Blog
</footer>

</body>
</html>
